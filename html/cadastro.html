<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="/css/estilo-padrao.css">
    <link rel="stylesheet" href="/css/cadastro-login2.css">

    <!-- link das fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>

<body>

    <header class="barra">

        <a href="/html/login.html"><img src="/img-video/logo-estrelas.svg">
        </a>

    </header>

    <span class="material-symbols-outlined voltar">
        arrow_back
    </span>

    <!-- container geral do conteúdo -->
    <section class="container-geral">

        <!-- <span class="material-symbols-outlined voltar">
            arrow_back
        </span> -->

        <!-- título do container -->
        <h1>Cadastro</h1>
        <p>Cadastre-se agora para ficar por dentro das atividades do clube!</p>

        <!-- Formulário -->

        <form action="cadastro" method="post">

            <div class="input">
                <label for="nome"></label>
                <input type="text" name="nome" id="nome" placeholder="Nome Completo" required>
            </div>


            <div class="input"><label for="email"></label>
                <input type="email" name="email" id="email" placeholder="Email" required>
            </div>

            <div class="input">
                <label for="telefone"></label>
                <input type="tel" name="telefone" id="telefone" placeholder="Telefone" required>
            </div>

            <div class="input"><label for="senha"></label>
                <input type="password" name="senha" id="senha" placeholder="Senha" required>
                <i id="olho-fechado" class="fa-solid fa-eye-slash senha-oculta"></i>
                <i id="olho-aberto" class="fa-solid fa-eye senha-oculta" style=display:none;></i>

            </div>

            

            <input type="submit" value="Cadastrar">


        </form>

    </section>

        <script src="/js/cadastro-login.js"></script>


</body>

</html>
